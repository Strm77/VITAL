<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V.I.T.A.L — Faturas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1>V.I.T.A.L</h1>
    <nav class="abas">
      <a class="aba" href="index.html" onclick="if (history.length > 1) { history.back(); return false; }">Financeiro</a>
      <span class="aba ativa">Faturas</span>
    </nav>
  </header>
  <main class="pagina-faturas">
    <a class="voltar" href="index.html" onclick="if (history.length > 1) { history.back(); return false; }">← Voltar ao painel</a>

    <section class="painel" aria-labelledby="titulo-cartoes">
      <div class="painel-cabecalho">
        <h2 id="titulo-cartoes">Cartões</h2>
        <span class="mes-atual">0 cartões</span>
      </div>
      <div class="cartoes" id="cartoes">
        <div class="cartao-vazio">
          <span class="chip" aria-hidden="true"></span>
          <p>Nenhum cartão cadastrado ainda.</p>
          <p class="dica">Seus cartões vão aparecer aqui.</p>
        </div>
      </div>
    </section>

    <section class="painel" aria-labelledby="titulo-faturas">
      <h2 id="titulo-faturas">Faturas</h2>
      <p class="estado">Esta parte ainda está em construção.</p>
    </section>
  </main>
</body>
</html>
